<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Learn guitar theory, sheet music, pedals and MuseScore by repetition.">
<meta name="theme-color" content="#0F766E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fret by Fret">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230F766E'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white' font-family='Georgia'%3EF%3C/text%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Fret by Fret</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Caveat:wght@500;700&family=Young+Serif&display=swap">
<style>

:root{
  --paper:#F5F7FC; --card:#FFFFFF; --ink:#1B2440; --muted:#5B6484; --faint:#8A92AE;
  --rule:#DCE3F2; --rule-strong:#C9D2EA; --margin:#E0575B;
  --pen:#0F766E; --pen-ink:#FFFFFF; --pen-soft:#DCF0EC;
  --good:#1D8052; --good-soft:#E1F3EA; --bad:#BF3B3B; --bad-soft:#FBE7E6; --warn:#9A6414; --warn-soft:#FBF0DC;
  --masc:#2F6FB5; --masc-soft:#E3EEFA; --fem:#B8406E; --fem-soft:#FAE6EE;
  --shadow:0 1px 2px rgba(27,36,64,.06),0 6px 20px rgba(27,36,64,.07);
  --f-ui:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-word:"Young Serif",Georgia,"Times New Roman",serif;
  --f-hand:"Caveat","Segoe Script","Bradley Hand",cursive;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1320; --card:#171C2C; --ink:#E7EAF6; --muted:#A1A9C6; --faint:#6F7896;
    --rule:#1C2335; --rule-strong:#283149; --margin:#8C3439;
    --pen:#5EC4B6; --pen-ink:#0F1320; --pen-soft:#16322E;
    --good:#52C992; --good-soft:#15352A; --bad:#F08080; --bad-soft:#3B1D22; --warn:#E6B45E; --warn-soft:#3A2D14;
    --masc:#86B6F0; --masc-soft:#1B2A40; --fem:#F08DB4; --fem-soft:#3A1D2B;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
    --paper:#0F1320; --card:#171C2C; --ink:#E7EAF6; --muted:#A1A9C6; --faint:#6F7896;
    --rule:#1C2335; --rule-strong:#283149; --margin:#8C3439;
    --pen:#5EC4B6; --pen-ink:#0F1320; --pen-soft:#16322E;
    --good:#52C992; --good-soft:#15352A; --bad:#F08080; --bad-soft:#3B1D22; --warn:#E6B45E; --warn-soft:#3A2D14;
    --masc:#86B6F0; --masc-soft:#1B2A40; --fem:#F08DB4; --fem-soft:#3A1D2B;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background-color:var(--paper); color:var(--ink); font:16px/1.5 var(--f-ui);
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px);
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px;border-radius:8px}
.page{
  position:relative; max-width:600px; margin:0 auto; min-height:100%;
  padding-inline:16px 16px; padding-block:12px calc(96px + env(safe-area-inset-bottom,0px));
}
@media (min-width:640px){
  .page{padding-inline:44px 24px}
  .page::before{content:"";position:absolute;left:28px;top:0;bottom:0;width:2px;background:var(--margin);opacity:.55}
}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
  padding-block:10px 12px;margin-inline:-16px;padding-inline:16px;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.titles{display:flex;flex-direction:column;gap:0}
.screen{font-family:var(--f-label,var(--f-ui));font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.logo{font-family:var(--f-hand);font-size:1.3rem;line-height:1.2;color:var(--pen);margin:0;font-weight:400}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid var(--rule-strong);font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill b{color:var(--ink)}
h2{font-size:1.2rem;margin:0;text-wrap:balance}
h3{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.stack{display:flex;flex-direction:column;gap:12px}
.card .stack{gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--rule-strong);border-radius:var(--radius);padding:16px}
.card.lift{box-shadow:var(--shadow);border-color:transparent}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:12px;border:1px solid var(--rule-strong);background:var(--card);font-weight:700;text-decoration:none;transition:transform .08s ease,background .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--pen);border-color:var(--pen);color:var(--pen-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--pen)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{width:46px;height:46px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid var(--rule-strong);background:var(--card);font-size:1.15rem;flex:none}
.icon-btn svg{width:22px;height:22px}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{flex-direction:column;gap:2px}
.btn .sub{display:block;font-size:.68rem;font-weight:400;opacity:.75;letter-spacing:.01em}
/* progress */
.bar{height:10px;border-radius:99px;background:var(--pen-soft);overflow:hidden}
.stage{border-top:1px dashed var(--rule-strong);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.bar>i{display:block;height:100%;background:var(--pen);border-radius:99px;transition:width .3s ease}
.big-num{font-family:var(--f-word);font-size:2.3rem;line-height:1;font-variant-numeric:tabular-nums}
/* ladder */
.ladder{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:2px}
.rung{border:1px solid var(--rule-strong);border-radius:12px;padding:10px 12px;background:var(--paper);display:flex;flex-direction:column;gap:2px;text-align:left;min-height:76px}
.rung .lvl{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.rung .name{font-weight:700}
.rung .st{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:auto}
.rung.passed{background:var(--good-soft);border-color:transparent}
.rung.passed .st{color:var(--good);font-weight:700}
.rung.ready{border-color:var(--pen);box-shadow:inset 0 0 0 1px var(--pen);background:var(--card)}
.rung.locked{opacity:.55}
.batch-list{display:flex;flex-direction:column;gap:0}
.batch-list .bl{width:100%;display:flex;flex-direction:column;gap:8px;padding:12px 2px;border-bottom:1px solid var(--rule);font-variant-numeric:tabular-nums;font-size:.92rem}
.batch-list .bl-t{display:flex;align-items:baseline;justify-content:space-between;gap:10px;min-width:0}
.batch-list .bl-a{display:grid;grid-template-columns:.8fr 1fr 1fr;gap:6px}
.batch-list .bl-a .mini{padding:7px 4px;white-space:nowrap;font-size:.8rem}
.mini{border:1px solid var(--rule-strong);background:var(--card);border-radius:9px;padding:7px 10px;font-size:.82rem;font-weight:700;min-height:36px}
.mini.solid{background:var(--pen);border-color:var(--pen);color:var(--pen-ink)}
.batch-list .bl:last-child{border-bottom:0}
.notice{border-radius:12px;padding:12px 14px;background:var(--warn-soft);color:var(--warn);font-size:.9rem}
.notice.good{background:var(--good-soft);color:var(--good)}
/* chips */
.chip{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:.76rem;font-weight:700;background:var(--pen-soft);color:var(--pen);letter-spacing:.02em}
.chip.m{background:var(--masc-soft);color:var(--masc)}
.chip.f{background:var(--fem-soft);color:var(--fem)}
.chip.plain{background:transparent;border:1px solid var(--rule-strong);color:var(--muted);font-weight:400}
/* word card */
.wordcard{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 16px}
.visual.flat{min-height:0}
.visual{position:relative;width:100%;max-width:100%;display:flex;justify-content:center;align-items:center;gap:14px;min-height:112px}
.emoji{font-size:4.6rem;line-height:1.1}
.photo{width:128px;height:112px;max-width:45%;border-radius:12px;object-fit:cover;background:var(--pen-soft)}
.photo-x{position:absolute;right:0;bottom:-4px;font-size:.72rem;border:0;background:transparent;color:var(--faint);text-decoration:underline;padding:2px}
.fr{font-family:var(--f-word);font-size:clamp(2.1rem,9vw,2.9rem);line-height:1.1;overflow-wrap:anywhere;margin:0}
.fr .art{color:var(--faint)}
.fr.m .art{color:var(--masc)} .fr.f .art{color:var(--fem)}
.en{font-size:1.2rem;font-weight:700;line-height:1.35}
.example{border-top:1px solid var(--rule);padding-top:12px;margin-top:2px;width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left}
.example .ex-fr{font-family:var(--f-word);font-size:1.08rem}
mark{background:var(--pen-soft);color:var(--ink);border-radius:4px;padding:0 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.feedback mark{background:rgba(127,127,127,.18);color:inherit}
.form-note{font-size:.82rem;color:var(--muted);margin-top:2px}
.contraction{font-size:.82rem;color:var(--muted);margin-top:2px}
.contraction b{color:var(--ink);font-family:var(--f-word);font-weight:400}
.dictform{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--paper)}
.form-note b{color:var(--ink);font-family:var(--f-word);font-weight:400}
.whybtn{border:1px solid var(--rule-strong);background:var(--card);color:var(--muted);width:20px;height:20px;border-radius:50%;font-size:.7rem;line-height:1;padding:0;vertical-align:middle}
/* reading */
.article{font-family:var(--f-word);font-size:1.12rem;line-height:1.85}
.article .tok{border:0;background:transparent;padding:0 1px;font:inherit;color:inherit;border-radius:4px}
.article .tok.known{background:var(--good-soft);color:var(--good)}
.article .tok.current{background:var(--pen-soft);color:var(--pen)}
.article .tok.soon{border-bottom:1.5px dotted var(--faint)}
.slots{display:flex;flex-wrap:wrap;gap:6px;min-height:52px;padding:10px;border:1.5px dashed var(--rule-strong);border-radius:12px;align-items:center}
.tiles{display:flex;flex-wrap:wrap;gap:6px}
.tile{font-family:var(--f-word);font-size:1.05rem;padding:8px 12px;border-radius:10px;border:1px solid var(--rule-strong);background:var(--card)}
.tile.placed{background:var(--pen-soft);border-color:var(--pen);color:var(--pen)}
.tile.good{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.tile.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.article-img{width:100%;max-height:200px;object-fit:cover;border-radius:12px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.reveal{border:1px dashed var(--rule-strong);border-radius:10px;padding:10px 16px;background:transparent;color:var(--muted);width:100%}
/* quiz */
.qhead{position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:5;display:flex;align-items:center;gap:12px;margin-bottom:12px;
  padding-block:8px;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(6px)}
.sticky-bar{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);z-index:4;padding-top:8px;
  background:linear-gradient(to top,var(--paper) 72%,transparent)}
.qhead .bar{flex:1}
.prompt{min-height:180px;justify-content:center}
.options{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:480px){.options{grid-template-columns:1fr 1fr}}
.opt{min-height:56px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--rule-strong);background:var(--card);text-align:left;font-weight:700;display:flex;align-items:center;gap:10px}
.opt .k{flex:none;width:24px;height:24px;border-radius:6px;border:1px solid var(--rule-strong);display:grid;place-items:center;font-size:.72rem;color:var(--faint)}
.opt.fr-opt{font-family:var(--f-word);font-weight:400;font-size:1.15rem}
.opt.correct{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt[disabled]{cursor:default}
.type-in{width:100%;font-family:var(--f-word);font-size:1.5rem;padding:12px 14px;border-radius:12px;border:1.5px solid var(--rule-strong);background:var(--card);text-align:center}
.type-in:focus{outline:none;border-color:var(--pen)}
.type-in.correct{border-color:var(--good);background:var(--good-soft)}
.type-in.wrong{border-color:var(--bad);background:var(--bad-soft)}
.accents{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.accents button{min-width:40px;height:40px;border-radius:8px;border:1px solid var(--rule-strong);background:var(--card);font-family:var(--f-word);font-size:1.05rem}
.feedback{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;text-align:left}
.feedback.good{background:var(--good-soft);color:var(--good)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.feedback .hand{font-family:var(--f-hand);font-size:1.15rem}
.feedback .fb-body{color:var(--ink)}
.listen-hero{display:flex;gap:14px;justify-content:center;align-items:center}
.play-big{width:96px;height:96px;border-radius:50%;border:0;background:var(--pen);color:var(--pen-ink);display:grid;place-items:center}
.play-big svg{width:40px;height:40px}
.result-score{font-family:var(--f-word);font-size:4rem;line-height:1}
.praise{font-family:var(--f-hand);font-size:1.6rem;color:var(--pen)}
.missed{display:flex;flex-direction:column}
.missed .mrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule)}
.missed .mrow:last-child{border-bottom:0}
.mrow .w{font-family:var(--f-word);font-size:1.05rem}
/* word list */
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--rule-strong);background:var(--card)}
.sticky-search{position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:5;display:flex;flex-direction:column;gap:8px;
  padding-block:8px;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(6px)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{padding:6px 12px;border-radius:999px;border:1px solid var(--rule-strong);background:var(--card);font-size:.86rem}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.wl{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--rule-strong);border-radius:var(--radius);overflow:hidden}
.wrow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:0;border-bottom:1px solid var(--rule);background:transparent;text-align:left;width:100%}
.wrow:last-child{border-bottom:0}
.wrow .n{font-size:.76rem;color:var(--faint);font-variant-numeric:tabular-nums}
.wrow .t{display:flex;flex-direction:column;min-width:0}
.wrow .t b{font-family:var(--f-word);font-weight:400;font-size:1.08rem}
.wrow .t span{font-size:.86rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--rule-strong)}
.dot.learned{background:var(--good)} .dot.current{background:var(--pen)} .dot.due{background:var(--warn)}
/* settings */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700}
.field select,.field input[type=number],.field textarea{padding:10px 12px;border-radius:10px;border:1px solid var(--rule-strong);background:var(--card)}
.field textarea{min-height:84px;font:12px/1.4 ui-monospace,Menlo,monospace;resize:vertical}
details.card>summary{cursor:pointer;list-style:none;font-size:1rem}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"▾";float:right;color:var(--muted)}
details.card[open]>summary::after{content:"▴"}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px}
.switch input{width:22px;height:22px;accent-color:var(--pen)}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--rule-strong);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs nav{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{border:0;background:transparent;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.76rem;color:var(--muted)}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--pen);font-weight:700}
/* modal */
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,14,28,.5);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.modal .sheet{width:100%;max-width:560px;max-height:90%;overflow:auto;margin-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:640px){.modal{align-items:center}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.pop{animation:pop .25s ease}
@keyframes pop{from{transform:scale(.96);opacity:.6}to{transform:none;opacity:1}}

:root{--maple:#EAD3A0;--maple-line:#B38F55;--rose:#5B2E22;--string:#7A8185}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--maple:#B8975F;--maple-line:#7E6238;--string:#C3CBCD}}
:root[data-theme="dark"]{--maple:#B8975F;--maple-line:#7E6238;--string:#C3CBCD}
.fbwrap{overflow-x:auto;width:100%;margin:2px 0}
.fretsvg{width:100%;max-width:560px;display:block;height:auto;margin:0 auto}
.fretsvg .board{fill:var(--maple)}
.fretsvg .fretline{stroke:var(--maple-line);stroke-width:2}
.fretsvg .nut{stroke:var(--rose);stroke-width:6}
.fretsvg .str{stroke:var(--string)}
.fretsvg .inlay{fill:var(--maple-line);opacity:.4}
.fretsvg .fnum{fill:var(--muted);font-size:11px;text-anchor:middle}
.fdot circle{stroke:#fff;stroke-width:2}
.fdot text{fill:#fff;font:700 11px var(--f-ui);text-anchor:middle;pointer-events:none}
.d-note circle{fill:var(--rose)}.d-root circle{fill:var(--pen)}.d-sel circle{fill:var(--ink)}.d-ok circle{fill:var(--good)}.d-bad circle{fill:var(--bad)}
.rowhl{fill:var(--pen);opacity:.16}
.cell{fill:transparent;cursor:pointer}.cell:hover{fill:rgba(255,255,255,.35)}
.cell:focus-visible{outline:3px solid var(--pen)}
.pbtn{border:1px solid var(--rule-strong);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:700;color:var(--ink)}
.pbtn.sm{padding:2px 10px;border-radius:8px}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem;margin:8px 0}
.tbl th,.tbl td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--rule)}
.tbl th{color:var(--muted);font-weight:700;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase}
pre.tab{background:var(--paper);border:1px solid var(--rule-strong);border-radius:10px;padding:12px;overflow-x:auto;font-size:.95rem;line-height:1.3;margin:8px 0}
.wordcard .example{display:block}
.wordcard .example p{margin:0 0 8px}
.fr.ans{max-width:100%}


.staffsvg{width:100%;max-width:440px;height:auto;display:block;margin:2px auto}
.staffsvg .ln{stroke:var(--ink);stroke-width:1;opacity:.85}
.staffsvg .ink,.staffsvg .stem{fill:var(--ink)}
.staffsvg .stem{stroke:var(--ink);stroke-width:1.4}
.staffsvg .open{fill:var(--card);stroke:var(--ink);stroke-width:1.8}
.staffsvg .arc{stroke:var(--ink);stroke-width:1.5}
.staffsvg .tsn{font-family:var(--f-word);font-weight:700;fill:var(--ink)}
.staffsvg .dyn{font-family:var(--f-word);font-style:italic;font-weight:700;fill:var(--ink)}
.kswrap{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kscell{display:flex;flex-direction:column;gap:2px;align-items:center}
.pedalsvg{width:100%;height:auto;display:block}
.pedalbox{max-width:240px;margin:0 auto;width:100%}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{border:1px solid var(--rule-strong);background:var(--card);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:4px;text-align:left}
.pcard b{font-size:.95rem}.pcard span{font-size:.78rem;color:var(--muted);line-height:1.3}
.pcard .pedalsvg{max-width:130px;margin:0 auto}
.guitarsvg{height:auto;display:block;margin:0 auto}
.gwrap{display:flex;justify-content:center;background:var(--pen-soft);border-radius:14px;padding:8px}
.gwrap .guitarsvg{width:100%;max-width:150px}
.gthumb{display:flex;justify-content:center;background:var(--pen-soft);border-radius:10px;padding:4px}
.gthumb .guitarsvg{width:100%;max-width:90px}
.libitem{text-align:left;width:100%;display:block}
.libitem h3{margin-bottom:2px}
ol.steps{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
kbd{font:700 .8rem var(--f-ui);border:1px solid var(--rule-strong);border-bottom-width:2px;border-radius:5px;padding:0 6px;background:var(--card)}
input[type=range].pk{width:100%;accent-color:var(--pen)}
a{color:var(--pen)}
.wordcard .gwrap{width:100%}

/* ---------- music data ---------- */
const NOTES=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];

function spell(root,steps,semis){const r=parse(root);return steps.map((st,i)=>{const li=(r.li+st)%7;const t=mod(r.pc+semis[i],12);const d=mod(t-LET_PC[li]+6,12)-6;return LET[li]+accStr(d)})}

/* ---------- audio: plucks ---------- */
let actx;

function pluck(m,t=0,dur=1.5,vol=.22){
  try{const c=ac(),f=440*Math.pow(2,(m-69)/12),t0=c.currentTime+t;
    const o1=c.createOscillator(),o2=c.createOscillator(),g2=c.createGain(),g=c.createGain(),lp=c.createBiquadFilter();
    o1.type='sawtooth';o2.type='triangle';o1.frequency.value=f;o2.frequency.value=f*2.004;g2.gain.value=.35;
    lp.type='lowpass';lp.frequency.setValueAtTime(3400,t0);lp.frequency.exponentialRampToValueAtTime(450,t0+dur);
    g.gain.setValueAtTime(.0001,t0);g.gain.linearRampToValueAtTime(vol,t0+.01);g.gain.exponentialRampToValueAtTime(.0008,t0+dur);
    o1.connect(lp);o2.connect(g2);g2.connect(lp);lp.connect(g);g.connect(c.destination);
    o1.start(t0);o2.start(t0);o1.stop(t0+dur+.05);o2.stop(t0+dur+.05);}catch(e){}
}
function playAudio(a){if(!a)return;const n=a.notes;if(a.mode==='chord')n.forEach((m,i)=>pluck(m,i*.035,2.2));else n.forEach((m,i)=>pluck(m,i*(a.gap||.5),Math.max(1.2,(a.gap||.5)*2.5)))}

/* ---------- Karplus-Strong guitar for the pedal demos ---------- */
function ksNote(sr,midi,dur,damp,bright){
  const f=440*Math.pow(2,(midi-69)/12),L=Math.max(2,Math.round(sr/f)),n=Math.floor(sr*dur),out=new Float32Array(n),buf=new Float32Array(L);
  let seed=midi*7919+13;const r=()=>{seed=(seed*16807)%2147483647;return seed/2147483647*2-1};
  let prev=0;for(let i=0;i<L;i++){const x=r();prev=prev*(1-bright)+x*bright;buf[i]=prev}
  let idx=0;for(let i=0;i<n;i++){const nx=(idx+1)%L;const v=(buf[idx]+buf[nx])*.5*damp;out[i]=buf[idx];buf[idx]=v;idx=nx}
  return out;
}
const RIFFS={
  lick:{len:7.2,ev:[[0,[40,47,52]],[.55,[55]],[.75,[59]],[.95,[64]],[1.5,[67]],[1.7,[69]],[1.9,[71]],[2.4,[74]],[2.6,[71]],[2.8,[69]],[3.0,[67]],[3.5,[64]],[3.7,[67]],[4.2,[40,47,52,55,59,64],.03],[5.6,[43,50,55,59,62,67],.03]]},

};
const bufCache={};
function riffBuffer(kind='lick',opts={}){
  const key=kind+JSON.stringify(opts);if(bufCache[key])return bufCache[key];
  const c=ac(),sr=c.sampleRate,R=RIFFS[kind],damp=opts.damp||.9965,bright=opts.bright||.9;
  const total=Math.floor(sr*R.len),data=new Float32Array(total);
  for(const[t,notes,strum]of R.ev){notes.forEach((m,i)=>{const off=Math.floor(sr*(t+(strum||0)*i)),s=ksNote(sr,m,2.4,damp,bright),g=notes.length>1?.32:.5;for(let k=0;k<s.length&&off+k<total;k++)data[off+k]+=s[k]*g})}
  let mx=0;for(let i=0;i<total;i++)mx=Math.max(mx,Math.abs(data[i]));
  for(let i=0;i<total;i++)data[i]=data[i]/(mx||1)*.8;
  const ab=c.createBuffer(1,total,sr);ab.copyToChannel(data,0);bufCache[key]=ab;return ab;
}

/* ---------- fretboard svg (tap-aware) ---------- */
function fretboard(o){
  const lo=o.lo||0,hi=o.hi||5,first=lo===0?1:lo,n=hi-first+1,fw=62,gap=32,left=46,top=22;
  const W=left+n*fw+12,H=top+5*gap+34;
  const sx=f=>f===0?left-24:left+(f-first+.5)*fw,sy=s=>top+(5-s)*gap;
  let h=`<svg class="fretsvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.alt||'Guitar fretboard, low E string at the bottom'}" style="${n>7?'min-width:'+Math.round(W*.8)+'px':''}">`;
  h+=`<rect class="board" x="${left}" y="${top-12}" width="${n*fw}" height="${5*gap+24}" rx="3"/>`;
  [3,5,7,9,15].forEach(f=>{if(f>=first&&f<=hi)h+=`<circle class="inlay" cx="${sx(f)}" cy="${top+2.5*gap}" r="6"/>`});
  if(12>=first&&12<=hi)h+=`<circle class="inlay" cx="${sx(12)}" cy="${top+1.5*gap}" r="6"/><circle class="inlay" cx="${sx(12)}" cy="${top+3.5*gap}" r="6"/>`;
  for(let i=0;i<=n;i++)h+=`<line class="${i===0&&lo===0?'nut':'fretline'}" x1="${left+i*fw}" x2="${left+i*fw}" y1="${top-12}" y2="${top+5*gap+12}"/>`;
  if(o.row!=null)h+=`<rect class="rowhl" x="${left-46}" y="${sy(o.row)-gap/2}" width="${n*fw+46}" height="${gap}" rx="6"/>`;
  for(let s=0;s<6;s++)h+=`<line class="str" x1="${left-40}" x2="${left+n*fw}" y1="${sy(s)}" y2="${sy(s)}" stroke-width="${(2.8-s*.34).toFixed(2)}"/>`;
  for(let f=first;f<=hi;f++)h+=`<text class="fnum" x="${sx(f)}" y="${H-8}">${f}</text>`;
  (o.dots||[]).forEach(d=>{if(d.f!==0&&(d.f<first||d.f>hi))return;if(d.f===0&&lo!==0)return;
    h+=`<g class="fdot d-${d.kind||'note'}"><circle cx="${sx(d.f)}" cy="${sy(d.s)}" r="12"/>${d.label?`<text x="${sx(d.f)}" y="${sy(d.s)+4}">${d.label}</text>`:''}</g>`});
  if(o.click)for(let s=0;s<6;s++){if(o.row!=null&&o.row!==s)continue;
    const fs=(lo===0?[0]:[]).concat(Array.from({length:n},(_,i)=>first+i));
    fs.forEach(f=>{const x=f===0?left-46:left+(f-first)*fw,w=f===0?46:fw;
      h+=`<rect class="cell" tabindex="0" role="button" aria-label="${SNAME[s]} string, fret ${f}" data-tk="${s}:${f}" x="${x}" y="${sy(s)-gap/2}" width="${w}" height="${gap}"/>`})}
  return`<div class="fbwrap">${h}</svg></div>`;
}
const winFor=f=>f<=5?{lo:0,hi:5}:{lo:f-2,hi:Math.min(f+2,15)};
const FB=o=>()=>fretboard(o);
function boxDots(r){const off=[[0,3],[0,2],[0,2],[0,2],[0,3],[0,3]],rpc=pcAt(0,r),d=[];off.forEach((os,s)=>os.forEach(o=>{const f=r+o,pc=pcAt(s,f);d.push({s,f,label:NOTES[pc],kind:pc===rpc?'root':'note'})}));return d}
function fretTap(base,pos){
  const keys=new Set(pos.map(p=>p.s+':'+p.f));
  const parseK=k=>{const[s,f]=k.split(':').map(Number);return{s,f}};
  return{keys,correct:k=>keys.has(k),render:(sel,res)=>{
    let dots=[];
    if(res){dots=pos.map(p=>({s:p.s,f:p.f,kind:'ok'}));if(sel&&!keys.has(sel)){const q=parseK(sel);dots.push({s:q.s,f:q.f,kind:'bad'})}}
    else if(sel){const q=parseK(sel);dots=[{s:q.s,f:q.f,kind:'sel'}]}
    return fretboard({...base,dots,click:!res});
  }};
}

const SP=9; // staff space in px
function glyph(name,x,y,scale,align){
  const g=GLY[name];if(!g)return'';const s=scale||SP/250,b=g.b;

  return`<path class="ink" transform="translate(${x.toFixed(1)},${y.toFixed(1)}) scale(${s},${-s}) translate(${ox},${oy})" d="${g.d}"/>`;
}

  if(kind==='lp'||kind==='super')return`<path d="M${x0},60 L${x0-4},30 C${x0-6},8 ${x0+8},2 100,2 C${x1-8},2 ${x1+6},8 ${x1+4},30 L${x1},60 Z"/>`;
  if(kind==='sg')return`<path d="M${x0},60 L${x0-2},40 L${x0+2},4 L${x1-2},4 L${x1+2},40 L${x1},60 Z"/>`;
  if(kind==='slotted')return`<path d="M${x0},60 L${x0-3},12 L${x1+3},12 L${x1},60 Z"/><rect x="${x0+2}" y="20" width="${w-2}" height="26" fill="rgba(0,0,0,.25)"/>`;
  return`<path d="M${x0},60 L${x0-4},26 C${x0-6},6 ${x0+6},2 100,2 C${x1-6},2 ${x1+6},6 ${x1+4},26 L${x1},60 Z"/>`;
}

  const outg=c.createGain();outg.gain.value=.85;master.connect(outg);outg.connect(c.destination);

function sheetPage(){
  const lab=(p,d,l)=>noteItem(p,d||'q',{lab:l||p[0]});

  const spaces=staff({items:['F4','A4','C5','E5'].map(p=>lab(p)),compact:true,below:46,alt:'Notes in the spaces: F A C E'});
  const ledger=staff({items:['E3','F3','G3','A3','B3','C4','D4'].map(p=>lab(p)),compact:true,below:46,alt:'Notes below the staff on ledger lines'});
  const rhy=staff({items:DURS.map(d=>noteItem('G4',d[0],{lab:d[2]})),compact:true,dx:56,below:46,alt:'Note values from whole to sixteenth'});
  const rests=staff({items:DURS.map(d=>({t:'rest',d:d[0]})),compact:true,dx:46,alt:'Rests from whole to sixteenth'});
  const kss=['G','D','F','B♭'].map(k=>{const ks=KS_TYPE(k);return`<div class="kscell"><b>${k} major</b>${staff({ks,items:[],compact:true,alt:k+' major key signature'})}</div>`}).join('');

   <section class="card stack"><h3 style="margin:0">Time signatures</h3><p class="muted small">Top: beats per bar. Bottom: which note gets the beat.</p><div class="kswrap">${[[4,4],[3,4],[2,4],[6,8]].map(t=>`<div class="kscell"><b>${t[0]}/${t[1]}</b>${staff({ts:t,items:[],compact:true})}</div>`).join('')}</div></section>

/* ---------- audio hooks ---------- */
function demoOnce(id,riff){
  demoStop();const c=ac();
  const master=c.createDynamicsCompressor();master.threshold.value=-8;master.ratio.value=8;
  const og=c.createGain();og.gain.value=.85;master.connect(og);og.connect(c.destination);
  const p=PEDAL[id],vals={};p.knobs.forEach(k=>vals[k.k]=k.def);
  const src=c.createBufferSource();src.buffer=riffBuffer(riff||p.riff,{});
  const fx=buildFx(c,id,vals);src.connect(fx.input);fx.output.connect(master);
  src.start();src.stop(c.currentTime+5.2);demo.src=src;
}
function toneOnce(tone){
  demoStop();demoStart({tone});setTimeout(()=>{if(demo.src&&demo.mode===null)demoStop()},5200);
}
function playAny(a){
  if(!a)return;
  if(a.pedal)return demoOnce(a.pedal,a.riff);
  if(a.tone){const c=ac(),t=TONES[a.tone];const src=c.createBufferSource();src.buffer=riffBuffer('lick',{damp:t.damp,bright:t.bright});let node=src;t.f.forEach(f=>{const b=c.createBiquadFilter();b.type=f.t;b.frequency.value=f.f;b.gain.value=f.g||0;b.Q.value=f.q||.7;node.connect(b);node=b});const g=c.createGain();g.gain.value=.8;node.connect(g);g.connect(c.destination);demoStop();src.start();src.stop(c.currentTime+4.5);demo.src=src;return}
  playAudio(a);
}

/* ---------- grading helpers ---------- */
function ctok(t){
  t=String(t).trim().replace(/♯/g,'#').replace(/♭/g,'b').replace(/°/g,'dim');
  const m=/^([A-Ga-g])([#b]?)(.*)$/.exec(t);if(!m)return null;
  let q=m[3].toLowerCase();if(['m','min','-','minor'].includes(q))q='m';else if(['dim','o'].includes(q))q='dim';else if(['','maj','major'].includes(q))q='';
  return{root:m[1].toUpperCase()+m[2],q};
}
function gradeMusic(sp,raw){
  const typed=raw.trim();
  if(sp.t==='note'){
    const m=/^([A-Ga-g])([#b♯♭]?)$/.exec(typed);
    if(!m)return{ok:false,note:'Type just a note name, like C, F# or Bb.'};
    const ok=parse(m[1].toUpperCase()+m[2]).pc===sp.pc;
    return{ok,note:ok&&typed.toUpperCase()!==sp.a.toUpperCase()&&sp.a.length<3?`Same pitch. In this context it's spelled ${sp.a}.`:''};
  }
  if(sp.t==='tokens'){
    if(sp.toks[0]==='none')return{ok:['none','no','nothing','0','zero','nosharpsorflats'].includes(typed.toLowerCase().replace(/\s/g,''))};
    const got=typed.split(/[\s,;]+/).filter(Boolean).map(ctok);
    if(got.length!==sp.toks.length||got.some(x=>!x))return{ok:false};
    const want=sp.toks.map(ctok);
    if(got.every((g,i)=>g.root===want[i].root&&g.q===want[i].q))return{ok:true};
    if(got.every((g,i)=>parse(g.root).pc===parse(want[i].root).pc&&g.q===want[i].q))return{ok:true,note:`Same pitches. Spelled properly: ${sp.a}`};
    return{ok:false};
  }
  return{ok:false};
}

/* ---------- squash & grading ---------- */
function squash(s){
  s=String(s);if(A.norm)s=A.norm(s);
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/♯/g,'#').replace(/♭/g,'b')
    .replace(/\bfirst\b/g,'1st').replace(/\bsecond\b/g,'2nd').replace(/\bthird\b/g,'3rd').replace(/\bfourth\b/g,'4th').replace(/\bfifth\b/g,'5th').replace(/\bsixth\b/g,'6th').replace(/\bseventh\b/g,'7th').replace(/\beighth\b/g,'8th')
    .replace(/^(the|a|an)\s+/,'').replace(/[\s\-_.,'"’()+]/g,'');
}
function gradeTyped(sp,raw){
  const typed=raw.trim();
  if(sp.t==='num')return{ok:typed===String(sp.a)};
  if(sp.t==='text'){
    const ok=(sp.acc||[sp.a]).some(x=>x[0]==='='?typed===x.slice(1):squash(typed)===squash(x));
    return{ok};
  }
  return A.grade?A.grade(sp,raw):{ok:false};
}
const hintFor=sp=>{
  if(A.hint){const h=A.hint(sp);if(h)return h}
  return String(sp.a).replace(/\S/g,(ch,i)=>i===0?ch:'_').replace(/_(?=_)/g,'_ ');
};

/* ---------- storage ---------- */
function load(k,fb){try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb}catch(e){return fb}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function freshState(){return{v:1,batches:[],cards:{},settings:{passMark:80,maxBatch:40,revDiv:3,autoplay:true,sfx:true,theme:''},stats:{streak:0,lastDay:-1,answers:0}}}
let S=load(A.storeKey,null)||freshState();
S.settings=Object.assign(freshState().settings,S.settings||{});
S.cards=S.cards||{};S.batches=S.batches||[];S.stats=Object.assign(freshState().stats,S.stats||{});
let storageOk=save(A.storeKey,S);
function persist(){storageOk=save(A.storeKey,S)}
const today=()=>{const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/864e5)};
function applyTheme(){const t=S.settings.theme;if(t)document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme')}
applyTheme();

/* ---------- specs ---------- */
function resolve(c,dir){const sp=(dir==='r'&&c.r)?c.r:c.f;return sp.dyn?Object.assign({},sp,sp.dyn()):sp}
const specOf=item=>item.spec||(item.spec=resolve(DECK[item.cid],item.dir));
const visOf=sp=>typeof sp.vis==='function'?sp.vis():(sp.vis||'');
const canR=(c,mode)=>!!c.r&&!(mode==='type'&&c.r.matchOnly);

/* ---------- batches ---------- */
const learnedCount=()=>S.batches.filter(x=>x.done).reduce((n,x)=>n+x.size,0);
const current=()=>S.batches[S.batches.length-1];
const newCards=b=>DECK.slice(b.start,b.start+b.size);
const revCards=b=>(b.extras||[]).map(i=>DECK[i]).filter(Boolean);
const batchCards=b=>newCards(b).concat(revCards(b));
const missCount=id=>{const w=S.cards[id];return w&&w.miss?w.miss:0};
function pickRevision(n,from,to){
  if(n<=0)return[];
  const pool=DECK.filter(c=>{const p=S.cards[c.id];return p&&p.box>0&&!(c.id>=from&&c.id<to)});
  if(!pool.length)return[];
  const sc=pool.map(c=>({id:c.id,score:missCount(c.id)*10+Math.random()*4+(S.cards[c.id].box<=1?3:0)}));
  sc.sort((a,b)=>b.score-a.score);return sc.slice(0,n).map(x=>x.id);
}
function nextSize(){
  if(!S.batches.length)return 10;
  const b=current();if(b.skipped)return 10;
  const sc=MODES.map(m=>b.modes[m.key].first).filter(x=>x!=null&&x>=0);
  const avg=sc.length?sc.reduce((a,c)=>a+c,0)/sc.length:0;
  let size=b.size;if(avg>=90)size+=10;else if(avg>=80)size+=5;else if(avg<65)size-=5;
  return Math.max(10,Math.min(S.settings.maxBatch,size));
}
function batchAvg(b){const s=MODES.map(m=>b.modes[m.key].first).filter(x=>x!=null&&x>=0);return s.length?Math.round(s.reduce((a,c)=>a+c,0)/s.length):null}
function newBatch(){
  const start=learnedCount();if(start>=TOTAL)return;
  const total=Math.min(nextSize(),TOTAL-start);
  const revision=S.batches.some(b=>b.done)?Math.round(total/S.settings.revDiv):0;
  const size=Math.max(1,total-revision);
  const extras=pickRevision(revision,start,start+size);
  const modes={};MODES.forEach(m=>modes[m.key]={best:null,first:null,passed:false});
  S.batches.push({n:S.batches.length+1,start,size,extras,done:false,modes});
  persist();
}
if(!S.batches.length||S.batches[S.batches.length-1].done)newBatch();
const modeUnlocked=(b,i)=>i===0||b.modes[MODES[i-1].key].passed;
const batchComplete=b=>MODES.every(m=>b.modes[m.key].passed);
function finishBatch(){
  const b=current();if(!b||b.done||!batchComplete(b))return;
  b.done=true;const d=today();
  newCards(b).forEach(c=>{const ws=S.cards[c.id]||(S.cards[c.id]={});ws.box=1;ws.due=d+1});
  newBatch();persist();
}
const dueCards=()=>{const d=today();return DECK.filter(c=>{const w=S.cards[c.id];return w&&w.box>0&&w.due<=d})};
function status(c){const w=S.cards[c.id],b=current();if(w&&w.box>0)return w.due<=today()?'due':'learned';if(b&&!b.done&&c.id>=b.start&&c.id<b.start+b.size)return'current';return'new'}
function bumpStreak(){const d=today(),st=S.stats;if(st.lastDay===d)return;st.streak=st.lastDay===d-1?st.streak+1:1;st.lastDay=d}
const liveStreak=()=>{const d=today();return(S.stats.lastDay===d||S.stats.lastDay===d-1)?S.stats.streak:0};
const weakCards=()=>DECK.filter(c=>missCount(c.id)>=2).sort((a,b)=>missCount(b.id)-missCount(a.id)).slice(0,12);

let view='home',tab='home',study=null,quiz=null,lastResult=null;
let filt={q:'',cat:'all',st:'all'};
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2400)}

/* ---------- card face ---------- */
function cardHTML(c,{hide=false,revealed=true}={}){
  const show=!hide||revealed,sp=resolve(c,'f'),rv=c.r?resolve(c,'r'):null;
  const ans=sp.a;
  return`<div class="card lift wordcard pop"><span class="chip">${CATS[c.cat]}</span>
    <p class="en" style="font-size:1.2rem">${sp.p}</p>
    ${visOf(sp)}
    ${show?`<p class="fr ans" style="${String(ans).length>22?'font-size:1.15rem':String(ans).length>9?'font-size:1.5rem':''}">${esc(ans)}</p>`:`<button class="reveal" data-action="reveal">Tap to show the answer</button>`}
    ${c.hear&&A.play?`<div class="row" style="justify-content:center"><button class="icon-btn" data-action="hear" data-id="${c.id}" aria-label="Hear it">${ICON_SPEAK}</button></div>`:''}
    ${show?`<div class="example"><div>${c.teach||''}${rv&&!rv.dyn?`<p class="muted small">Also: ${rv.p} <b>${esc(rv.a)}</b></p>`:''}</div></div>`:''}
  </div>`;
}

/* ---------- home ---------- */
function renderHome(){
  const learned=learnedCount(),b=current(),due=dueCards().length,weak=weakCards();
  let html=`<div class="stack">`;
  if(!storageOk)html+=`<p class="notice">This browser isn't saving progress (private mode or blocked storage). Use Settings → Backup to keep a copy.</p>`;

  const catRows=Object.keys(CATS).map(k=>{const all=DECK.filter(c=>c.cat===k),got=all.filter(c=>(S.cards[c.id]||{}).box>0).length;return all.length?`<span class="chip plain">${CATS[k]} ${got}/${all.length}</span>`:''}).join('');
  html+=`<section class="card lift stack"><p class="muted small">Cards learned</p>

    ${cur?(()=>{const n=DECK.slice(cur.start,cur.end).filter(c=>(S.cards[c.id]||{}).box>0).length,t=cur.end-cur.start;return`<div class="stage"><div class="row spread"><p class="small"><b>${STAGES.indexOf(cur)+1}/${STAGES.length}</b> · ${cur.name}</p><p class="muted small">${n}/${t}</p></div><div class="bar" style="height:6px"><i style="width:${n/t*100}%"></i></div></div>`})():''}
    <div class="row" style="gap:6px">${catRows}</div></section>`;
  if(due)html+=`<section class="card row spread"><h2>${due} card${due>1?'s':''} to review</h2><div class="row"><button class="btn primary" data-action="review" data-style="mixed">Review</button><button class="btn" data-action="review" data-style="type">Review by typing</button></div></section>`;
  if(weak.length)html+=`<section class="card stack"><div class="row spread"><h2>Weak spots</h2><span class="chip">${weak.length}</span></div><p class="muted small">${weak.slice(0,5).map(c=>esc(c.ti)).join(' · ')}${weak.length>5?' …':''}</p><div class="btn-row"><button class="btn" data-action="weak" data-mode="match">Match them</button><button class="btn" data-action="weak" data-mode="type">Type them</button></div></section>`;
  if(!b){
    html+=`<section class="card stack"><p class="praise">All done!</p><h2>You've worked through all ${TOTAL} cards.</h2><p class="muted">Keep up your reviews, and use the Cards tab to drill any topic.</p></section>`;
  }else{
    const complete=batchComplete(b);
    html+=`<section class="card stack"><div><h3 style="margin:0 0 2px">Batch ${b.n}</h3><div class="row spread" style="align-items:baseline"><h2>Cards ${b.start+1}–${b.start+b.size}</h2><span class="chip">${b.size} new${(b.extras&&b.extras.length)?` + ${b.extras.length}`:''}</span></div></div>
      <p class="muted small">${newCards(b).slice(0,6).map(c=>esc(c.ti)).join(' · ')}${b.size>6?' …':''}</p>
      ${(b.extras&&b.extras.length)?`<p class="muted small">Revision mixed in: ${b.extras.slice(0,5).map(i=>esc(DECK[i].ti)).join(' · ')}${b.extras.length>5?' …':''}</p>`:''}
      <div class="ladder">${MODES.map((m,i)=>{const st=b.modes[m.key],un=modeUnlocked(b,i),cls=st.passed?'passed':un?'ready':'locked';
        const label=st.passed?`Passed · ${st.best}%`:un?(st.best!=null?`Best ${st.best}% · need ${S.settings.passMark}%`:'Ready'):'Locked';
        return`<button class="rung ${cls}" data-action="test" data-mode="${m.key}" ${un?'':'disabled'} aria-label="${m.name} test, ${label}"><span class="lvl">${m.lvl}</span><span class="name">${m.name}</span><span class="st">${label}</span></button>`}).join('')}</div>
      ${complete?`<p class="notice good">Batch passed with a first-try average of ${batchAvg(b)}%. Next batch: ${nextSize()} cards.</p><div class="btn-row"><button class="btn primary" data-action="study">Study cards</button><button class="btn" data-action="nextbatch">Unlock next batch</button></div>`
      :`<div class="btn-row"><button class="btn primary" data-action="study">Study cards</button>${(()=>{const i=MODES.findIndex((m,idx)=>modeUnlocked(b,idx)&&!b.modes[m.key].passed);const m=MODES[i];return`<button class="btn" data-action="test" data-mode="${m.key}">Test: ${m.name}</button>`})()}</div>`}
    </section>`;
  }
  if(A.homeExtra)html+=A.homeExtra();
  const done=S.batches.filter(x=>x.done).reverse(),showAll=window.__showAll;
  if(done.length){
    html+=`<h3>Finished batches</h3><section class="card batch-list" style="padding:6px 16px">${(showAll?done:done.slice(0,6)).map(x=>`<div class="bl"><div class="bl-t"><span>Batch ${x.n} · cards ${x.start+1}–${x.start+x.size}</span>${batchAvg(x)!=null?`<span class="muted small">${batchAvg(x)}% first try</span>`:''}</div><div class="bl-a"><button class="mini solid" data-action="studybatch" data-n="${x.n}">Study</button><button class="mini" data-action="testbatch" data-mode="match" data-n="${x.n}">Match</button><button class="mini" data-action="testbatch" data-mode="type" data-n="${x.n}">Type</button></div></div>`).join('')}</section>${done.length>6&&!showAll?`<button class="btn ghost wide" data-action="showall">Show all ${done.length} batches</button>`:''}`;
  }
  $app.innerHTML=html+`</div>`;
}

/* ---------- quiz engine ---------- */
function makeItem(c,mode){
  if(mode==='listen')return{cid:c.id,mode:'listen',kind:'listen',dir:'f',spec:resolve(c,'f')};
  let dir='f';
  if(mode==='match'){if(canR(c,mode)&&c.r.t!=='tap'&&Math.random()<.5)dir='r'}
  else if(canR(c,mode)&&Math.random()<.5)dir='r';
  const sp=resolve(c,dir);
  let kind=mode==='match'?'match':(sp.t==='tap'?'tap':'type');
  if(mode==='match'&&dir==='f'&&c.f.audio&&Math.random()<.45)kind='listen';
  return{cid:c.id,mode,kind,dir,spec:sp};
}
const makeItems=(cs,modeFor)=>shuffle(cs).map(c=>makeItem(c,modeFor(c)));
function startTest(mode){const b=current(),cs=batchCards(b);quiz={type:'batch',mode,queue:makeItems(cs,()=>mode),total:cs.length,first:{},doneIds:new Set(),answered:null,missed:[],tapSel:null};view='quiz';render();window.scrollTo(0,0)}
function startPractice(ids,mode){
  const cs=ids.map(i=>DECK[i]).filter(Boolean),pool=mode==='listen'?cs.filter(c=>c.f.audio):cs;
  if(!pool.length)return toast('Nothing to practise yet');
  quiz={type:'practice',mode,queue:makeItems(pool,()=>mode),total:pool.length,first:{},doneIds:new Set(),answered:null,missed:[],tapSel:null};view='quiz';render();window.scrollTo(0,0);
}
function startReview(style){
  const cs=shuffle(dueCards()).slice(0,40);if(!cs.length)return;
  const modeFor=c=>style==='type'?'type':style==='match'?'match':(((S.cards[c.id]||{}).box||1)<=1?'match':'type');
  quiz={type:'review',queue:makeItems(cs,modeFor),total:cs.length,first:{},doneIds:new Set(),answered:null,missed:[],tapSel:null};view='quiz';render();window.scrollTo(0,0);
}
const ansOf=(x,dir)=>{const sp=(dir==='r'&&x.r)?x.r:x.f;return sp.dyn||sp.t==='tap'?null:sp.a};
function optionsFor(item){
  if(item.opts)return item.opts;
  const c=DECK[item.cid],sp=specOf(item),a=sp.a;let pool=[];
  if(sp.opts)pool=sp.opts.slice();
  else if(sp.pool)pool=(typeof sp.pool==='function'?sp.pool():sp.pool).slice();
  else if(sp.t==='num'){const n=+a;for(let k=Math.max(0,n-4);k<=n+4;k++)pool.push(String(k))}
  else if(A.defaultOpts&&A.defaultOpts(sp))pool=A.defaultOpts(sp).slice();
  else pool=DECK.filter(x=>x.grp===c.grp&&x.id!==c.id).map(x=>ansOf(x,item.dir)).filter(x=>x!=null);
  pool=uniq(pool).filter(x=>x!==a);
  if(pool.length<3)pool=uniq(pool.concat(DECK.filter(x=>x.cat===c.cat&&x.id!==c.id).map(x=>ansOf(x,item.dir)).filter(x=>x!=null&&x!==a)));
  if(pool.length<3)pool=uniq(pool.concat(DECK.filter(x=>x.id!==c.id).map(x=>ansOf(x,item.dir)).filter(x=>x!=null&&x!==a)));
  item.opts=shuffle([a,...sample(pool,3)]);return item.opts;
}
function tapRender(item,sel,res){return specOf(item).tap.render(sel,res)}
function renderQuiz(){
  const item=quiz.queue[0],c=DECK[item.cid],sp=specOf(item),a=quiz.answered,doneN=quiz.doneIds.size;
  const title=quiz.type==='review'?'Review':quiz.type==='practice'?(({match:'Match',type:'Type',listen:'Ear'})[quiz.mode]||quiz.mode)+' practice':MODES.find(m=>m.key===quiz.mode).name;
  let body='';
  if(item.kind==='match'||item.kind==='listen'){
    const opts=optionsFor(item);
    if(item.kind==='listen'){
      body=`<div class="card lift wordcard prompt"><div class="listen-hero"><button class="play-big" data-action="playq" aria-label="Play the sound">${ICON_PLAY}</button></div>${a?`<p class="en">${esc(c.ti)}</p>`:`<p class="muted small">Listen, then choose what you heard.</p>`}</div>`;
    }else{
      body=`<div class="card lift wordcard prompt"><span class="chip">${CATS[c.cat]}</span><p class="en" style="font-size:1.2rem">${sp.p}</p>${visOf(sp)}</div>`;
    }
    body+=`<div class="options">${opts.map((o,k)=>{let cls='';if(a){if(o===sp.a)cls='correct';else if(k===a.pick)cls='wrong'}return`<button class="opt ${cls}" data-action="pick" data-k="${k}" ${a?'disabled':''}><span class="k">${k+1}</span><span>${esc(o)}</span></button>`}).join('')}</div>`;
  }else if(item.kind==='tap'){
    const res=a?{ok:a.ok,sel:a.sel}:null;
    body=`<div class="card lift wordcard prompt"><span class="chip">${CATS[c.cat]}</span><p class="en" style="font-size:1.2rem">${sp.p}</p>${visOf(sp)}${sp.sub?`<p class="muted small">${sp.sub}</p>`:''}<div id="tapboard" style="width:100%">${tapRender(item,quiz.tapSel,res)}</div></div>
      ${a?'':`<div class="btn-row"><button class="btn" data-action="giveup">Show answer</button><button class="btn primary" id="checktap" data-action="checktap" ${quiz.tapSel==null?'disabled':''}>Check</button></div>`}`;
  }else{
    const keys=A.keys?A.keys(sp):[];
    body=`<div class="card lift wordcard prompt"><span class="chip">${CATS[c.cat]}</span><p class="en" style="font-size:1.2rem">${sp.p}</p>${visOf(sp)}${item.hint&&!a?`<p class="muted" style="font-family:var(--f-word);letter-spacing:.15em">${esc(hintFor(sp))}</p>`:''}</div>
      <form id="typeform" class="stack" autocomplete="off">
        <input id="type-answer" class="type-in ${a?(a.ok?'correct':'wrong'):''}" autocapitalize="off" autocorrect="off" spellcheck="false" ${sp.t==='num'?'inputmode="numeric"':''} placeholder="${esc(sp.ph||'Type your answer…')}" aria-label="Your answer" ${a?'readonly':''} value="${a?esc(a.typed):''}">
        ${a?'':`${keys.length?`<div class="accents" aria-label="Symbol keys">${keys.map(k=>`<button type="button" data-action="key" data-c="${esc(k)}">${k===' '?'space':esc(k)}</button>`).join('')}</div>`:''}
        <div class="btn-row"><button type="button" class="btn" data-action="${item.hint?'giveup':'hint'}">${item.hint?'Show answer':'Hint (counts as a miss)'}</button><button class="btn primary" type="submit">Check</button></div>`}
      </form>`;
  }
  let fb='';
  if(a){
    fb=`<div class="feedback ${a.ok?'good':'bad'} pop"><span class="hand">${a.ok?pickPraise():'Not quite…'}</span>${a.note?`<p class="fb-body small"><b>${esc(a.note)}</b></p>`:''}<p class="fb-body"><b>${esc(sp.a)}</b></p><div class="fb-body small">${c.why||''}</div></div>
      <div class="sticky-bar">${item.kind==='type'&&!a.ok&&!item.hint?`<div class="btn-row"><button class="btn" data-action="override">I was right</button><button class="btn primary" data-action="continue" id="continue-btn">Continue</button></div>`:`<button class="btn primary wide" data-action="continue" id="continue-btn">Continue</button>`}</div>`;
  }
  $app.innerHTML=`<div class="stack"><div class="qhead"><button class="icon-btn" data-action="quit" aria-label="Quit test">✕</button><div class="bar"><i style="width:${doneN/quiz.total*100}%"></i></div><span class="pill"><b>${doneN}</b>/${quiz.total}</span></div>
    <p class="muted small">${title}${quiz.type==='batch'?` · Batch ${current().n}`:''}${item.retry?' · second go':''}</p>${body}${fb}</div>`;
  if(item.kind==='tap'&&a&&sp.tap.after)sp.tap.after();
  if(item.kind==='listen'&&!a&&A.play)setTimeout(()=>A.play(c.f.audio),200);
  if(item.kind==='type'&&!a){const inp=document.getElementById('type-answer');inp&&inp.focus({preventScroll:true})}
  if(a){const b=document.getElementById('continue-btn');b&&b.focus({preventScroll:true});if(S.settings.autoplay&&c.hear&&A.play)A.play(c.hear)}
}
const PRAISE=['Nice.','Spot on.','Clean.','Exactly.','Good one.','Yes!','Right.'];
const pickPraise=()=>PRAISE[rnd(PRAISE.length)];
function sfx(ok){if(S.settings.sfx&&A.sfx)A.sfx(ok)}
function recordAnswer(ok,extra){
  const item=quiz.queue[0];
  const snap={cid:item.cid,wasFirst:!(item.cid in quiz.first),ws:S.cards[item.cid]?JSON.parse(JSON.stringify(S.cards[item.cid])):null,missedLen:quiz.missed.length};
  extra=Object.assign({snap},extra||{});
  if(!(item.cid in quiz.first)){quiz.first[item.cid]=ok;if(!ok){quiz.missed.push(item.cid);const ws=S.cards[item.cid]||(S.cards[item.cid]={box:0,due:0});ws.miss=(ws.miss||0)+1}}
  if(quiz.type==='review'||quiz.type==='practice'){
    const ws=S.cards[item.cid]||(S.cards[item.cid]={box:1,due:today()});
    if(!item.retry){if(ok){ws.box=Math.min((ws.box||1)+1,INTERVALS.length-1);ws.due=today()+INTERVALS[ws.box]}else{ws.box=1;ws.due=today()+1}}
  }
  S.stats.answers++;sfx(ok);
  quiz.answered=Object.assign({ok},extra);render();
}
function overrideRight(){
  const a=quiz&&quiz.answered;if(!a||a.ok||!a.snap)return;const s=a.snap;
  if(s.wasFirst)delete quiz.first[s.cid];quiz.missed.length=s.missedLen;
  if(s.ws)S.cards[s.cid]=s.ws;else delete S.cards[s.cid];
  S.stats.answers--;quiz.answered=null;
  recordAnswer(true,{typed:a.typed,note:'Counted as right — your call.'});
}
function checkTyped(raw){
  const item=quiz.queue[0],sp=specOf(item);if(!raw.trim())return;
  let r=gradeTyped(sp,raw);
  if(item.hint&&r.ok)r={ok:false,note:'Correct, but a hint was used, so it goes back in the pile.'};
  recordAnswer(r.ok,{typed:raw,note:r.note||''});
}
function advance(){
  const item=quiz.queue.shift(),ok=quiz.answered&&quiz.answered.ok;
  if(ok)quiz.doneIds.add(item.cid);else quiz.queue.push(retryOf(item));
  quiz.answered=null;quiz.tapSel=null;
  if(!quiz.queue.length)return finishQuiz();
  render();window.scrollTo(0,0);
}
function retryOf(item){
  const c=DECK[item.cid];let dir=item.dir;
  if(canR(c,item.mode)){const nd=dir==='f'?'r':'f',sp=resolve(c,nd);if(!(item.mode==='match'&&sp.t==='tap')&&!(item.mode==='listen'&&nd==='r'))dir=nd}
  const sp=resolve(c,dir);let kind=item.kind;
  if(item.mode==='type')kind=sp.t==='tap'?'tap':'type';
  else if(item.mode==='match')kind=(item.kind==='listen'&&dir==='f')?'listen':'match';
  return{cid:item.cid,mode:item.mode,kind,dir,spec:sp,retry:true};
}
function finishQuiz(){
  const ids=Object.keys(quiz.first),score=Math.round(ids.filter(k=>quiz.first[k]).length/ids.length*100);
  const res={type:quiz.type,mode:quiz.mode,score,missed:quiz.missed.slice(),passed:false};
  if(quiz.type==='batch'){
    const st=current().modes[quiz.mode];
    if(st.first==null)st.first=score;
    st.best=Math.max(st.best??0,score);
    if(score>=S.settings.passMark)st.passed=true;
    res.passed=st.passed&&score>=S.settings.passMark;
  }else res.passed=true;
  if(quiz.type==='practice')res.practice=true;
  bumpStreak();persist();lastResult=res;quiz=null;view='result';render();window.scrollTo(0,0);
}
function renderResult(){
  const r=lastResult,b=current(),nextIdx=r.type==='batch'?MODES.findIndex(m=>m.key===r.mode)+1:-1,complete=b&&batchComplete(b);
  let actions='';
  if(r.type==='review'||r.practice)actions=`<button class="btn primary wide" data-action="home">Back</button>`;
  else if(!r.passed)actions=`<div class="btn-row"><button class="btn primary" data-action="study">Study again</button><button class="btn" data-action="test" data-mode="${r.mode}">Try again</button></div>`;
  else if(complete)actions=`<button class="btn primary wide" data-action="nextbatch">Unlock next batch (${nextSize()} cards)</button>`;
  else if(nextIdx<MODES.length)actions=`<button class="btn wide" data-action="test" data-mode="${MODES[nextIdx].key}">Next level: ${MODES[nextIdx].name}</button><button class="btn ghost wide" data-action="home">Back</button>`;
  $app.innerHTML=`<div class="stack"><section class="card lift stack" style="text-align:center;align-items:center">
    <p class="praise">${r.practice?'Practice done':r.type==='review'?'Review done':r.passed?'Level passed':'Almost!'}</p><p class="result-score">${r.score}%</p>
    <p class="muted">${r.practice?'right first time. Misses come back in review.':r.type==='review'?'right first time. Missed cards come back tomorrow.':r.passed?`right first time. You needed ${S.settings.passMark}%.`:`right first time. You need ${S.settings.passMark}% to pass. Missed cards are below.`}</p></section>
    ${actions}
    ${r.missed.length?`<h3>Missed first time</h3><section class="card missed" style="padding:4px 16px">${r.missed.map(id=>{const c=DECK[id];return`<div class="mrow">${c.hear&&A.play?`<button class="icon-btn" data-action="hear" data-id="${id}" aria-label="Hear ${esc(c.ti)}">${ICON_SPEAK}</button>`:''}<div><p class="w">${esc(c.ti)}</p><p class="muted small">${esc(c.f.a)}</p></div></div>`}).join('')}</section>
    ${r.type==='batch'&&!r.passed?`<button class="btn wide" data-action="studymissed">Study just these ${r.missed.length}</button>`:''}`:''}</div>`;
}

/* ---------- cards list ---------- */
function renderCards(){
  const q=filt.q.trim().toLowerCase();
  let list=DECK.filter(c=>(filt.cat==='all'||c.cat===filt.cat)&&(filt.st==='all'||status(c)===filt.st)&&(!q||c.ti.toLowerCase().includes(q)||String(c.f.a).toLowerCase().includes(q)));
  const shown=list.slice(0,150);
  const catBtns=['all',...Object.keys(CATS)].map(k=>`<button data-action="fcat" data-v="${k}" aria-pressed="${filt.cat===k}">${k==='all'?'All':CATS[k]}</button>`).join('');
  const stBtns=[['all','Any'],['learned','Learned'],['due','Due'],['current','Current'],['new','New']].map(([k,l])=>`<button data-action="fst" data-v="${k}" aria-pressed="${filt.st===k}">${l}</button>`).join('');
  $app.innerHTML=`<div class="stack"><div class="sticky-search"><input class="search" id="search" type="search" placeholder="Search ${TOTAL} cards" value="${esc(filt.q)}" aria-label="Search cards"><div class="filters">${catBtns}</div><div class="filters">${stBtns}</div></div>
   ${filt.cat!=='all'?`<section class="card stack"><p class="muted small">Drill <b>${CATS[filt.cat]}</b> using cards you've already learned.</p><div class="btn-row"><button class="btn" data-action="drillcat" data-mode="match">Match</button><button class="btn" data-action="drillcat" data-mode="type">Type</button></div></section>`:''}
   <p class="muted small">${list.length} card${list.length===1?'':'s'}${list.length>150?' (first 150 shown)':''}</p>
   <div class="wl">${shown.map(c=>`<button class="wrow${A.thumb?' th':''}" data-action="open" data-id="${c.id}"><span class="n">${A.thumb?A.thumb(c):c.id+1}</span><span class="t"><b>${esc(c.ti)}</b><span>${esc(c.f.a)}</span></span><i class="dot ${status(c)}" aria-label="${status(c)}"></i></button>`).join('')}</div></div>`;
  const s=document.getElementById('search');s.oninput=()=>{filt.q=s.value;const pos=s.selectionStart;renderCards();const n=document.getElementById('search');n.focus();n.setSelectionRange(pos,pos)};
}
function openCard(id){
  const c=DECK[id],root=document.getElementById('modal-root');
  root.innerHTML=`<div class="modal" data-action="closemodal"><div class="sheet stack">${cardHTML(c)}<div class="btn-row"><button class="btn" data-action="drillone" data-id="${id}">Quiz me on this</button><button class="btn primary" data-action="closemodal">Close</button></div></div></div>`;
}

/* ---------- settings ---------- */
function renderSettings(){
  const s=S.settings;
  $app.innerHTML=`<div class="stack"><section class="card stack"><h2>Learning</h2>
   <div class="field"><label for="set-pass">Pass mark for each level</label><select id="set-pass">${[70,80,90,100].map(v=>`<option value="${v}" ${s.passMark===v?'selected':''}>${v}% right first time</option>`).join('')}</select></div>
   <div class="field"><label for="set-max">Largest batch size</label><select id="set-max">${[20,30,40,60].map(v=>`<option value="${v}" ${s.maxBatch===v?'selected':''}>${v} cards</option>`).join('')}</select><p class="muted small">Batches grow with your first-try average.</p></div>
   <div class="field"><label for="set-rev">Revision mixed into each new batch</label><select id="set-rev">${[[4,'A quarter'],[3,'A third'],[2,'Half']].map(([v,l])=>`<option value="${v}" ${s.revDiv===v?'selected':''}>${l}</option>`).join('')}</select><p class="muted small">Older cards you miss most come back first.</p></div>
   ${A.play?`<label class="switch"><span>Play the sound after each answer</span><input type="checkbox" id="set-autoplay" ${s.autoplay?'checked':''}></label>`:''}
   ${A.sfx?`<label class="switch"><span>Right/wrong chime</span><input type="checkbox" id="set-sfx" ${s.sfx?'checked':''}></label>`:''}
   <div class="field"><label for="set-theme">Theme</label><select id="set-theme">${[['','Match my device'],['light','Light'],['dark','Dark']].map(([v,l])=>`<option value="${v}" ${s.theme===v?'selected':''}>${l}</option>`).join('')}</select></div></section>
  <section class="card stack"><h2>Backup</h2><p class="muted small">Progress lives in this browser. Save a copy to move it to another device.</p><div class="btn-row"><button class="btn" data-action="export">Download backup</button><label class="btn" for="imp" style="cursor:pointer">Restore backup</label></div><input type="file" id="imp" accept="application/json" hidden>
   <button class="btn danger wide" data-action="reset">Reset all progress</button></section>
  <p class="muted small" style="text-align:center">${TOTAL} cards · ${S.stats.answers} answers given</p></div>`;
  const on=(id,fn)=>{const e=document.getElementById(id);if(!e)return;e.onchange=()=>{fn(e);persist()}};
  on('set-pass',e=>s.passMark=+e.value);on('set-max',e=>s.maxBatch=+e.value);on('set-rev',e=>s.revDiv=+e.value);
  on('set-autoplay',e=>s.autoplay=e.checked);on('set-sfx',e=>s.sfx=e.checked);on('set-theme',e=>{s.theme=e.value;applyTheme()});
  document.getElementById('imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!Array.isArray(o.batches)||typeof o.cards!=='object')throw 0;S=Object.assign(freshState(),o);S.settings=Object.assign(freshState().settings,S.settings||{});persist();applyTheme();toast('Backup restored');render()}catch(x){toast("That file isn't a "+A.name+" backup")}};r.readAsText(f)};
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  if(A.click&&A.click(e))return;
  const tk=e.target.closest('[data-tk]');
  if(tk&&quiz&&view==='quiz'&&quiz.queue[0].kind==='tap'&&!quiz.answered){
    quiz.tapSel=tk.dataset.tk;const item=quiz.queue[0];const tsp=specOf(item);
    if(tsp.tap.update)tsp.tap.update(quiz.tapSel);else document.getElementById('tapboard').innerHTML=tapRender(item,quiz.tapSel,null);
    const b=document.getElementById('checktap');if(b)b.disabled=false;
    const again=document.querySelector(`[data-tk="${CSS.escape(quiz.tapSel)}"]`);if(again&&again.focus)again.focus({preventScroll:true});
    return;
  }
  const t=e.target.closest('[data-action]');if(!t)return;
  const act=t.dataset.action,b=current();
  if(act==='closemodal'){if(t.classList.contains('modal')&&e.target!==t)return;document.getElementById('modal-root').innerHTML='';return}
  switch(act){
    case'tab':setTab(t.dataset.tab);break;
    case'home':goHome();break;
    case'study':startStudy(batchCards(b).map(c=>c.id));break;
    case'studybatch':{const x=S.batches.find(y=>y.n===+t.dataset.n);startStudy(batchCards(x).map(c=>c.id));break}
    case'studymissed':startStudy(lastResult.missed);break;
    case'studydone':goHome();break;
    case'next':study.i++;study.revealed=false;renderStudy();window.scrollTo(0,0);break;
    case'prev':study.i--;study.revealed=false;renderStudy();window.scrollTo(0,0);break;
    case'reveal':study.revealed=true;renderStudy();break;
    case'test':startTest(t.dataset.mode);break;
    case'testbatch':{const x=S.batches.find(y=>y.n===+t.dataset.n);startPractice(batchCards(x).map(c=>c.id),t.dataset.mode);break}
    case'nextbatch':finishBatch();goHome();break;
    case'review':startReview(t.dataset.style);break;
    case'weak':startPractice(weakCards().map(c=>c.id),t.dataset.mode);break;
    case'ear':{const reached=DECK.filter(c=>c.f.audio&&((S.cards[c.id]||{}).box>0||(b&&c.id<b.start+b.size)));if(reached.length<2)return toast('Learn some intervals or chords first');startPractice(reached.map(c=>c.id),'listen');break}
    case'showall':window.__showAll=true;renderHome();break;
    case'pick':if(quiz.answered)break;{const item=quiz.queue[0],sp=specOf(item),k=+t.dataset.k;recordAnswer(optionsFor(item)[k]===sp.a,{pick:k})}break;
    case'playq':{const it=quiz.queue[0];A.play&&A.play(specOf(it).audio||DECK[it.cid].f.audio);break}
    case'continue':advance();break;
    case'quit':if(confirm('Quit this test? Progress on it will be lost.')){goHome()}break;
    case'hint':quiz.queue[0].hint=true;renderQuiz();break;
    case'giveup':if(quiz.queue[0].kind==='tap')recordAnswer(false,{sel:null});else recordAnswer(false,{typed:'',note:''});break;
    case'checktap':{const sp=specOf(quiz.queue[0]);recordAnswer(sp.tap.correct(quiz.tapSel),{sel:quiz.tapSel});break}
    case'key':{const inp=document.getElementById('type-answer');if(inp){const p=inp.selectionStart??inp.value.length;inp.value=inp.value.slice(0,p)+t.dataset.c+inp.value.slice(inp.selectionEnd??p);inp.focus();const np=p+t.dataset.c.length;inp.setSelectionRange(np,np)}break}
    case'override':overrideRight();break;
    case'hear':{const c=DECK[+t.dataset.id];c&&A.play&&A.play(c.hear);break}
    case'fcat':filt.cat=t.dataset.v;renderCards();break;
    case'fst':filt.st=t.dataset.v;renderCards();break;
    case'drillcat':{const ids=DECK.filter(c=>c.cat===filt.cat&&(S.cards[c.id]||{}).box>0).map(c=>c.id);if(!ids.length)return toast('Learn some of these first');startPractice(ids,t.dataset.mode);break}
    case'open':openCard(+t.dataset.id);break;
    case'drillone':document.getElementById('modal-root').innerHTML='';startPractice([+t.dataset.id],'type');break;
    case'export':{const bl=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=A.slug+'-backup.json';a.click();break}
    case'reset':if(confirm('Reset all progress? This cannot be undone.')){S=freshState();persist();applyTheme();newBatch();render()}break;
    default:if(A.action)A.action(act,t,e);
  }
});
document.addEventListener('submit',e=>{if(e.target.id==='typeform'){e.preventDefault();if(quiz&&!quiz.answered)checkTyped(document.getElementById('type-answer').value)}});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[data-tk]')){e.preventDefault();e.target.click();return}
  if(view!=='quiz'||!quiz)return;
  if(/^[1-4]$/.test(e.key)&&!quiz.answered&&document.querySelector('.opt')&&document.activeElement.tagName!=='INPUT'){const b=document.querySelectorAll('.opt')[+e.key-1];b&&b.click()}
});
window.E={openCard,render,setTab,toast,esc,S:()=>S,persist,goHome,shuffle,sample,rnd,DECK,ICON_PLAY,ICON_SPEAK,get view(){return view},set view(v){view=v},get tab(){return tab},set tab(v){tab=v},$app};
if(A.init)A.init();
render();
})();

</script>
</body>
